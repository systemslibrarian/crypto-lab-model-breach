name: One-time reviewed-fix Pages release

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-reviewed-fix.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: 657d8214837af426e594a08fa52e09e8cc301434

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
      - name: Verify reviewed revision
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Focused verification
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify reviewed build checksums
        run: |
          cat > /tmp/reviewed-build.sha256 <<'SUMS'
          9f4af753fba945d5549974fb06debd45b67636efef417032cc43fc89233c77e9  dist/assets/index-D_RbfSAk.js
          5f8cbd28f0868f41d6bcc1c0c01bf9658220fa8708402788e342963c7ae199bb  dist/assets/index-DnIMvqST.css
          4e0cd1df40026168d4a1abb876924f7eded982af455f603ecf69888e04f5482a  dist/favicon.svg
          b45fa506195cfcdef406ba9f0c77b36ddc1a7c224040926ec70abc2fdea7b93a  dist/icons.svg
          b72b19a6ce24f997ffe07f369ec7b4cd53e66b88f40ab2ee3e1d366f7b1cc5ff  dist/index.html
          SUMS
          sha256sum -c /tmp/reviewed-build.sha256
      - name: Upload reviewed build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed build
        id: deployment
        uses: actions/deploy-pages@v5
