name: Gate

# ONE definition of this lab's gate, called by the workflow a Dependabot bump
# must clear and by the workflow that publishes. `needs:` cannot cross files,
# so before this the deploy carried its own copy and nothing held the two
# equal -- in this lab they had already drifted apart.
#
# A separate file rather than `workflow_call` on the CI workflow, because that
# file's dependabot-auto-merge job holds contents: write, pull-requests: write
# and actions: write, and a called workflow may not hold permissions above its
# CALLER. Calling it from a deploy that holds contents: read fails the run at
# startup before any job exists (measured: crypto-lab-key-exchange run
# 44528331135, conclusion startup_failure).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest — AESL KAT · AEAD round-trip · key recovery)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser gates (differential-step exhibit + axe-core WCAG A/AA)
        run: npm run test:a11y
